<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="Nav-bar">
        <div class="description">
            <div class="logo">
                <img class="logo-image" src="tooth.png" alt="Dental Logo">
            </div>
            <div class="dental-name">
                <p>Dentistry With a Smile</p>
            </div>
        </div>
        <div class="address">
            <p>Consolacion Cebu, Philippines</p>
        </div>
    </div>
    <div class="login-box">
        <div class="login-content"> 
            <div class="logo-box">
                <img class="logo-login" src="tooth.png" alt="Dental Logo">
                <p class="login-header">Dentistry With a Smile</p>

            </div>
            <div class="login-form">
                <form>
                    <input class="input" type="text" id="first-name" name="first-name" placeholder="Enter your first name" required>
                    <input class="input" type="text" id="last-name" name="last-name" placeholder="Enter your last name" required>
                    <br><br>
                    <input class="input-email" type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
                    <input class="input-password" type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
                    <button class="submit-button" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="footer">
        Liloy
    </footer>
</body>
</html>
